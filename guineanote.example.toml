# Pass explicitly with --config guineanote.example.toml.
# Interface: "vi" or "en". --language overrides this; F8 opens language Settings.
language = "vi"
tab_width = 4
large_file_warning_bytes = 10485760
syntax = true
sidebar_width = 30
mouse = true
# Use a 256-color theme for terminals without true color.
basic_colors = false
# ANSI 16-color palette (auto-selected for TERM=linux/vt100/vt102/ansi).
ansi_colors = false

# Private periodic draft checkpoints; source files still save explicitly.
recovery = true
# NO_COLOR is honored by default. Set explicitly to override it.
# no_color = true
