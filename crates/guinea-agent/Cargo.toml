[package]
name = "guinea-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "guineanote-agent"
path = "src/main.rs"

[[bin]]
name = "guineanote-mcp"
path = "src/mcp.rs"

[dependencies]
guinea-service.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }

[lints]
workspace = true
